<svg width="800" height="500">

    <!-- Sky -->
    <rect width="800" height="500" fill="#B9D9EB"/>

    <!-- Sun -->
    <circle cx="700" cy="80" r="45" fill="#FFA500"/>

    <!-- Clouds -->
    <g fill="white">
        <circle cx="120" cy="80" r="25"/>
        <circle cx="150" cy="65" r="30"/>
        <circle cx="180" cy="80" r="25"/>

        <circle cx="520" cy="100" r="25"/>
        <circle cx="550" cy="85" r="30"/>
        <circle cx="580" cy="100" r="25"/>
    </g>

    <!-- Grass -->
    <rect x="0" y="320" width="800" height="180" fill="#228B22"/>

    <!-- Fence -->
    <g stroke="#36454F" stroke-width="4">
        <line x1="0" y1="300" x2="800" y2="300"/>

        <line x1="40" y1="270" x2="40" y2="320"/>
        <line x1="90" y1="270" x2="90" y2="320"/>
        <line x1="140" y1="270" x2="140" y2="320"/>
        <line x1="190" y1="270" x2="190" y2="320"/>
        <line x1="240" y1="270" x2="240" y2="320"/>
        <line x1="290" y1="270" x2="290" y2="320"/>
        <line x1="340" y1="270" x2="340" y2="320"/>
        <line x1="390" y1="270" x2="390" y2="320"/>
        <line x1="440" y1="270" x2="440" y2="320"/>
        <line x1="490" y1="270" x2="490" y2="320"/>
        <line x1="540" y1="270" x2="540" y2="320"/>
        <line x1="590" y1="270" x2="590" y2="320"/>
        <line x1="640" y1="270" x2="640" y2="320"/>
        <line x1="690" y1="270" x2="690" y2="320"/>
        <line x1="740" y1="270" x2="740" y2="320"/>
        <line x1="790" y1="270" x2="790" y2="320"/>
    </g>

    <!-- Tree trunk -->
    <rect x="100" y="190" width="35" height="130"
          fill="#3D2B1F"/>

    <!-- Tree leaves -->
    <g fill="#4CBB17">
        <circle cx="118" cy="120" r="45"/>
        <circle cx="88" cy="150" r="45"/>
        <circle cx="160" cy="150" r="45"/>
        <circle cx="118" cy="175" r="45"/>
        <circle cx="70" cy="170" r="45"/>
        <circle cx="60" cy="140" r="35"/>
        <circle cx="160" cy="185" r="35"/>
    </g>

    <!-- Apples -->
    <g fill="red" stroke="darkred" stroke-width="1">
        <circle cx="135" cy="120" r="5"/>
        <circle cx="118" cy="145" r="5"/>
        <circle cx="90" cy="162" r="5"/>
        <circle cx="145" cy="160" r="5"/>
        <circle cx="120" cy="102" r="5"/>
        <circle cx="78" cy="135" r="5"/>
        <circle cx="60" cy="180" r="5"/>
        <circle cx="130" cy="195" r="5"/>
    </g>

    <!-- House -->
    <rect x="280" y="180" width="220" height="140"
          fill="#955521"/>

    <!-- Roof -->
    <polygon points="250,180 390,80 530,180"
             fill="#C58B4A"/>

    <!-- Chimney -->
    <rect x="450" y="105"
          width="35"
          height="60"
          fill="#A52A2A"/>

    <!-- Smoke -->
    <g fill="#696969" opacity="0.8">
        <circle cx="468" cy="90" r="8"/>
        <circle cx="476" cy="72" r="11"/>
        <circle cx="465" cy="55" r="13"/>
    </g>

    <!-- Windows -->
    <g fill="#CFEFFF" stroke="black" stroke-width="2">
        <rect x="310" y="210" width="45" height="45"/>
        <rect x="425" y="210" width="45" height="45"/>
    </g>

    <!-- Door -->
    <rect x="365" y="240"
          width="50"
          height="80"
          fill="#A6653A"/>

    <!-- Door knob -->
    <circle cx="402" cy="280"
            r="4"
            fill="black"/>

    <!-- Double curved path -->
    <path d="M365 320
             C300 340, 160 390, 190 450
             S290 540, 330 560"
          stroke="#F4B942"
          stroke-width="6"
          fill="none"/>

    <path d="M415 320
             C360 340, 230 390, 250 445
             S350 545, 400 570"
          stroke="#F4B942"
          stroke-width="6"
          fill="none"/>

<!-- Right Flower 1 -->
<g>
    <line x1="620" y1="360" x2="620" y2="420"
          stroke="#008000" stroke-width="4"/>
    <circle cx="620" cy="350" r="10" fill="yellow"/>
    <circle cx="608" cy="350" r="7" fill="pink"/>
    <circle cx="632" cy="350" r="7" fill="pink"/>
    <circle cx="620" cy="338" r="7" fill="pink"/>
    <circle cx="620" cy="362" r="7" fill="pink"/>
</g>

<!-- Right Flower 2 -->
<g>
    <line x1="680" y1="370" x2="680" y2="430"
          stroke="#008000" stroke-width="4"/>
    <circle cx="680" cy="360" r="10" fill="yellow"/>
    <circle cx="668" cy="360" r="7" fill="red"/>
    <circle cx="692" cy="360" r="7" fill="red"/>
    <circle cx="680" cy="348" r="7" fill="red"/>
    <circle cx="680" cy="372" r="7" fill="red"/>
</g>

<!-- Right Flower 3 -->
<g>
    <line x1="740" y1="360" x2="740" y2="420"
          stroke="#008000" stroke-width="4"/>
    <circle cx="740" cy="350" r="10" fill="yellow"/>
    <circle cx="728" cy="350" r="7" fill="purple"/>
    <circle cx="752" cy="350" r="7" fill="purple"/>
    <circle cx="740" cy="338" r="7" fill="purple"/>
    <circle cx="740" cy="362" r="7" fill="purple"/>
</g>

    <!-- Title -->
    <text x="280"
          y="470"
          font-size="28"
          font-family="Arial"
          fill="white">
        My SVG House
    </text>

</svg>
